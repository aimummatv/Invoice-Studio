<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Invoice &amp; Billing Studio | Magic Roots</title><link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/invoice.css"><script defer src="lib/decimal.js"></script><script defer src="lib/qrcode.js"></script><script defer src="lib/lucide.min.js"></script><script defer src="shared/core.js"></script><script defer src="shared/invoice-view.js"></script><script defer src="js/studio.js"></script></head>
<body>
<div id="studio-workstation" class="workstation">
  <header class="command-header"><div class="app-brand"><span class="brand-icon" aria-hidden="true">MR</span><div><h1>Invoice &amp; Billing Studio <small>v3.0</small></h1><p id="document-support">Offline desktop workstation</p></div></div><nav class="document-tabs" aria-label="Document types" id="document-tabs"></nav><div class="header-tools"><span id="live-clock"></span><button data-action="messenger" title="WhatsApp Messenger"><i data-lucide="message-square"></i><span>WhatsApp</span></button><button data-action="theme" aria-label="Toggle light or dark theme"><i data-lucide="moon"></i></button><button data-action="settings" title="Business and settings"><i data-lucide="settings-2"></i></button></div></header>
  <div class="command-ribbon"><div class="ribbon-group"><label class="document-picker">DOCUMENT <select id="document-select" aria-label="Saved documents"><option value="">New draft</option></select></label><button data-action="new" class="button-green"><i data-lucide="plus"></i>New Draft</button><span id="save-status" role="status">Opening database…</span><span id="lifecycle" class="pill">Draft</span></div><div class="ribbon-group"><button data-action="undo" title="Undo draft edit (Ctrl+Z)"><i data-lucide="undo-2"></i>Undo</button><button data-action="save" title="Save draft (Ctrl+S)"><i data-lucide="save"></i>Save Draft</button><button data-action="issue" class="button-green"><i data-lucide="check-check"></i><span id="issue-label">Issue document</span></button><button data-action="pdf"><i data-lucide="download"></i>PDF</button><button data-action="print" title="Print (Ctrl+P)"><i data-lucide="printer"></i>Print</button></div></div>
  <div id="notice" class="notice hidden" role="alert"></div>
  <div class="workspace-body"><aside class="step-sidebar"><div><p class="section-eyebrow">DOCUMENT WORKFLOW</p><nav id="step-nav" aria-label="Editor steps"></nav></div><div class="sidebar-bottom"><button data-action="register"><i data-lucide="list-filter"></i>Invoice register</button><button data-action="payments"><i data-lucide="wallet"></i>Payments</button><button data-action="catalogue"><i data-lucide="package"></i>Products</button><button data-action="customers"><i data-lucide="contact-round"></i>Customers</button><button data-action="reports"><i data-lucide="chart-no-axes-combined"></i>Commercial pulse</button><button data-action="excel"><i data-lucide="sheet"></i>Excel &amp; recovery</button></div></aside>
    <main id="studio-editor-panel" class="editor-panel"><div id="editor-heading"></div><div id="editor-fields"></div></main><div id="studio-splitter" class="splitter" role="separator" aria-label="Resize editor and preview" aria-orientation="vertical" tabindex="0"></div>
    <section class="preview-panel" id="studio-preview-panel" aria-label="Invoice preview"><div class="preview-toolbar"><span><i data-lucide="scan-line"></i>A4 live preview</span><button data-action="appearance"><i data-lucide="sliders-horizontal"></i>Appearance</button></div><div id="printable-studio-invoice-container"></div><p class="preview-note">PDF and print paginate at readable size, with repeated table headings and page numbers.</p></section>
  </div>
  <footer class="favourites-bar"><span><i data-lucide="star"></i>FAVOURITE BUYERS</span><div id="favourite-buyers"></div><button data-action="customers"><i data-lucide="plus"></i>Manage</button><span class="database-indicator"><span></span>SQLite · offline ready</span></footer>
</div>
<dialog id="app-dialog"><div class="dialog-header"><div><p class="section-eyebrow" id="dialog-eyebrow">INVOICE STUDIO</p><h2 id="dialog-title"></h2></div><button data-action="close-dialog" aria-label="Close dialog"><i data-lucide="x"></i></button></div><div id="dialog-body"></div></dialog>
<div id="toast-container" role="status" aria-live="polite"></div>
</body></html>
